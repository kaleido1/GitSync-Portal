name: Test plugin

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Verify generated bundle is committed
        run: git diff --exit-code -- main.js

      - name: Verify community plugin assets
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugin-build
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
