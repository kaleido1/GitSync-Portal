name: Build and publish plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Verify release version
        run: node scripts/check-release.mjs "${{ github.ref_name }}"

      - name: Package plugin folder
        run: |
          mkdir -p release/gitsync-port
          cp main.js manifest.json styles.css release/gitsync-port/
          cd release
          zip -r ../gitsync-port-${{ github.ref_name }}.zip gitsync-port

      - name: Verify ZIP layout
        run: |
          unzip -Z1 gitsync-port-${{ github.ref_name }}.zip | grep -Fx "gitsync-port/main.js"
          unzip -Z1 gitsync-port-${{ github.ref_name }}.zip | grep -Fx "gitsync-port/manifest.json"
          unzip -Z1 gitsync-port-${{ github.ref_name }}.zip | grep -Fx "gitsync-port/styles.css"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          main.js manifest.json styles.css gitsync-port-${{ github.ref_name }}.zip
          --title "GitSync Port ${{ github.ref_name }}"
          --generate-notes
